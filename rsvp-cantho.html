<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Nhận Tham Dự - Cần Thơ</title>
    
    <!-- Cập nhật chính xác link Google Fonts hệ thống để nhận diện font chữ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: "Playfair Display", serif;
            background-color: #3a3a3a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .form-container {
            background-color: #4a4a4a;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-sizing: border-box; /* Bảo vệ khung chứa không bị tràn màn hình mobile */
        }
        h2 {
            font-family: 'Great Vibes', cursive;
            font-size: 50px;
            color: #f3e5ab;
            margin-top: 0;
            margin-bottom: 10px;
        }
        p {
            color: #e0e0e0;
            margin-bottom: 30px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #f3e5ab;
            font-weight: bold;
            font-size: 16px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #666;
            border-radius: 5px;
            background-color: #555;
            color: #fff;
            font-family: "Playfair Display", serif;
            box-sizing: border-box;
            font-size: 16px;
        }
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 5px;
        }
        .radio-group label {
            color: #fff;
            font-weight: normal;
            cursor: pointer;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #f3e5ab;
            color: #3a3a3a;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
        }
        .btn-submit:disabled {
            background-color: #cccccc;
            color: #666666;
            cursor: not-allowed;
        }
        .btn-back {
            display: inline-block;
            margin-top: 20px;
            color: #cccccc;
            text-decoration: none;
            font-size: 14px;
        }
        .btn-back:hover {
            color: #f3e5ab;
        }

        /* Tối ưu hóa hiển thị mượt mà trên điện thoại di động nhỏ */
        @media screen and (max-width: 480px) {
            .form-container {
                padding: 30px 20px;
                margin: 15px;
            }
            h2 { font-size: 42px; }
        }
    </style>
</head>
<body>

<div class="form-container">
    <h2>RSVP Cần Thơ</h2>
    <p>Sự hiện diện của bạn là niềm vinh hạnh lớn cho chúng tôi!</p>

    <!-- SỬA LỖI CHÍNH: Đã làm sạch đường link Google Apps Script, loại bỏ đoạn dính chữ trùng lặp -->
    <form id="rsvpForm" action="https://script.google.com/macros/s/AKfycbzb0lDiXpi19rTbxYDU1zo1M1pVCh8_YkFU4GCIbvVGQHXlZ1bT9hdLpECY_iAHW4ts9Q/exec" method="POST">
        
        <div class="form-group">
            <label for="fullname">Họ và Tên của bạn:</label>
            <input type="text" id="fullname" name="fullname" placeholder="Nhập họ và tên..." required>
        </div>

        <div class="form-group">
            <label>Bạn sẽ tham dự chứ?</label>
            <div class="radio-group">
                <label><input type="radio" name="attend" value="Chắc chắn đến" checked> Chắc chắn đến</label>
                <label><input type="radio" name="attend" value="Rất tiếc không thể đến"> Rất tiếc không thể đến</label>
            </div>
        </div>

        <div class="form-group">
            <label for="guests">Số lượng người đi cùng:</label>
            <select id="guests" name="guests">
                <option value="Đi một mình">Đi một mình</option>
                <option value="Đi 2 người">Đi 2 người</option>
                <option value="Đi 3 người">Đi 3 người</option>
                <option value="Đi cả gia đình">Đi cả gia đình</option>
            </select>
        </div>

        <div class="form-group">
            <label for="message">Lời chúc gửi đến cô dâu & chú rể (nếu có):</label>
            <input type="text" id="message" name="message" placeholder="Viết lời chúc tại đây...">
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">Xác Nhận Ngay</button>
    </form>

    <a href="index.html" class="btn-back">← Quay lại trang thiệp chính</a>
</div>

<!-- Đã tối ưu hóa cấu trúc URLSearchParams chuẩn mực cho môi trường chạy thử máy cá nhân -->
<script>
    document.getElementById('rsvpForm').addEventListener('submit', function(e) {
        e.preventDefault(); 

        const form = this;
        const button = document.getElementById('submitBtn');
        
        button.disabled = true;
        button.innerText = "Đang lưu thông tin...";

        // Ép cấu trúc form sang định dạng URLSearchParams để Google Script xử lý mượt mà tiếng Việt
        const searchParams = new URLSearchParams(new FormData(form));

        // Thực hiện gửi dữ liệu
        fetch(form.action, {
            method: 'POST',
            body: searchParams,
            mode: 'no-cors', // Vượt qua kiểm tra CORS bảo mật của trình duyệt tại máy cá nhân
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            }
        })
        .then(() => {
            // Chuyển hướng ngay sang trang sơ đồ vị trí sau khi đẩy dữ liệu đi thành công
            window.location.href = "details-cantho.html";
        })
        .catch(error => {
            console.error('Lỗi hệ thống:', error);
            alert('Hệ thống bận, vui lòng thử lại sau vài giây!');
            button.disabled = false;
            button.innerText = "Xác Nhận Ngay";
        });
    });
</script>

</body>
</html>
